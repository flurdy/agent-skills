name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq
          pip install ruff

      # Git identity is required: several suites build throwaway repositories
      # and commit into them.
      - name: Configure git
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI

      - name: Shell lint
        run: make clean-code

      - name: Python lint
        run: make lint-python

      - name: Skill catalog
        run: make validate-skills

      - name: Security scan
        run: make security-scan

      - name: Tests
        run: make test
